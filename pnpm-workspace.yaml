packages:
  - apps/*
  - packages/**
  - tooling/*
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  msw: true
  sharp: true
  supabase: true
catalogMode: prefer
cleanupUnusedCatalogs: true
minimumReleaseAgeIgnoreMissingTime: false
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - supabase
minimumReleaseAgeExclude:
  - '@base-ui/*'
  - react
  - react-dom
  - stripe

