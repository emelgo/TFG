# CI del TFG PymeKit.
#
# Fase 0: solo se comprueba el desmarcado y se genera el informe de comentarios.
# En la Fase 1 se añaden typecheck, lint, tests unitarios, pgTAP (Supabase
# local) y E2E con Playwright, partiendo del flujo de CI de la base SaaS.
name: TFG

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controles-tfg:
    name: Controles del TFG
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Bloqueante: no puede quedar ninguna referencia a los proyectos de origen.
      - name: Comprobar desmarcado
        run: node scripts/tfg/check-branding.mjs

      # Informativo hasta la Fase 4; entonces se añadirá --strict.
      - name: Informe de comentarios en inglés
        run: node scripts/tfg/report-comments.mjs
